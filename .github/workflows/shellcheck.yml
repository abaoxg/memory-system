name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Shell 语法与规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POSIX sh 语法检查
        run: |
          fail=0
          for f in scripts/*.sh; do
            if sh -n "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          additional_files: ""
        continue-on-error: true

      - name: 脚本可执行位检查
        run: |
          fail=0
          for f in scripts/*.sh; do
            if [ -x "$f" ]; then
              echo "OK   $f 有执行位"
            else
              echo "WARN $f 缺执行位（不阻断）"
            fi
          done
          exit 0
